[project]
name = "veda-script-automation"
version = "0.1.0"
description = "Agentic system that structures OCR text of Sanskrit books into per-shloka records"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-ai-slim[openrouter]>=2.55,<3",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
