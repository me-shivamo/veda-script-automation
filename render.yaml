# Render Blueprint: describes the service so Render can create it from this repository.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: veda-script-automation
    runtime: docker
    plan: free            # see docs/DOCUMENTATION.md, "Keeping runs permanently", before relying on this
    region: singapore     # the Render region nearest to India
    healthCheckPath: /healthz
    autoDeployTrigger: commit   # redeploy whenever the deployed branch gets a new commit
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false             # Render asks you for this when you create the service; leave it empty to use only your Claude plan
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false             # optional: the token from `claude setup-token`, to run on your Claude plan
      - key: ALLOW_CLAUDE_PLAN
        sync: false             # set to 1 only if you alone use this copy; Anthropic does not allow a Claude plan to serve others
      - key: APP_USERNAME
        value: veda
      - key: APP_PASSWORD
        generateValue: true     # Render makes a random password; read or change it under Environment
      - key: DATABASE_URL
        sync: false             # a Postgres connection string, so runs survive restarts; see docs/DOCUMENTATION.md
